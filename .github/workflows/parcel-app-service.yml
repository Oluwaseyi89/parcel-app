name: parcel-app-service

on:
  push:
    branches:
      - main
    paths:
      - 'parcel-app-service/**'
      - '.github/workflows/parcel-app-service.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'parcel-app-service/**'
      - '.github/workflows/parcel-app-service.yml'

defaults:
  run:
    working-directory: parcel-app-service

jobs:
  ci:
    name: Django Check, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parcel_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parcel_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: parcel_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      USE_S3: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: parcel-app-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg

          host = os.environ["DATABASE_HOST"]
          port = os.environ["DATABASE_PORT"]
          dbname = os.environ["DATABASE_NAME"]
          user = os.environ["DATABASE_USER"]
          password = os.environ["DATABASE_PASSWORD"]

          for attempt in range(30):
              try:
                  with psycopg.connect(
                      host=host,
                      port=port,
                      dbname=dbname,
                      user=user,
                      password=password,
                  ):
                      print("PostgreSQL is ready")
                      break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY

      - name: Django system check
        run: python manage.py check

      - name: Ensure migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      # The Postgres service starts empty on every run, so this proves the full
      # migration history (including the temp-table backfills) applies cleanly.
      - name: Apply migrations to a fresh database
        run: python manage.py migrate --noinput

      - name: Verify no migrations are left unapplied
        run: python manage.py migrate --check

      # Deploy rollbacks need reversible migrations: unapply every project app,
      # then re-apply to confirm the history works in both directions.
      - name: Roll back and re-apply project migrations
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import django

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "parcel_app.settings")
          django.setup()
          from django.apps import apps

          base = Path.cwd().resolve()
          project_apps = [
              config.label
              for config in apps.get_app_configs()
              if Path(config.path).resolve().is_relative_to(base)
              and (Path(config.path) / "migrations").is_dir()
          ]
          for label in reversed(project_apps):
              print(f"Unapplying {label}", flush=True)
              subprocess.run(["python", "manage.py", "migrate", label, "zero", "--noinput"], check=True)
          PY
          python manage.py migrate --noinput
          python manage.py migrate --check

      # Production static storage hashes and compresses files and fails on broken references,
      # so collect with DEBUG off as a deploy would. Production settings require S3 for media;
      # the placeholder bucket is never contacted because static files go through whitenoise.
      - name: Collect static files with production settings
        env:
          DJANGO_DEBUG: "False"
          USE_S3: "True"
          AWS_STORAGE_BUCKET_NAME: ci-placeholder-bucket
          S3_MEDIA_PUBLIC: "False"
          AWS_QUERYSTRING_AUTH: "True"
        run: python manage.py collectstatic --noinput

      - name: Run test suite
        run: python manage.py test --verbosity 2
