spring.application.name=parcel-app-payment
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.html

# Database Configuration
# Environment variables loaded from .env file via DotEnv in ParcelApplication.main()
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Server Configuration
server.port=8080

# Paystack Configuration
paystack.secret.key=${PAYSTACK_SECRET_KEY}

# Parcel App Service internal sync configuration
parcelapp.service.base-url=${PARCEL_APP_SERVICE_BASE_URL:http://localhost:8000}
parcelapp.service.payment-sync-path=/order/payments/internal/sync
parcelapp.service.payment-sync-token=${PAYMENT_SYNC_TOKEN:}